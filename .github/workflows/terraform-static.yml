name: Terraform static validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: terraform-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: terraform-static
    runs-on: ubuntu-latest
    steps:
      - name: Enforce trusted pull request source
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTOR" = "$EXPECTED_OWNER"

      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Terraform 1.15.8
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Initialize without backend and validate
        shell: bash
        run: |
          set -euo pipefail
          for root in foundation phase0 state wif; do
            terraform -chdir="infra/bootstrap/$root" init \
              -backend=false \
              -input=false \
              -lockfile=readonly \
              -no-color
            terraform -chdir="infra/bootstrap/$root" validate -no-color
          done

  iac-security:
    name: iac-security
    runs-on: ubuntu-latest
    steps:
      - name: Enforce trusted pull request source
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTOR" = "$EXPECTED_OWNER"

      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          version: v0.70.0
          cache: false
          format: table
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: '1'
