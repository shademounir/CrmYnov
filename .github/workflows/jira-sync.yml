name: Jira workflow simulation

on:
  create:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review
      - closed
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jira-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.pull_request.head.repo.full_name == null ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIRA_BASE_URL: ""
      JIRA_CLOUD_ID: ""
      JIRA_USER_EMAIL: ""
      JIRA_API_TOKEN: ""
      JIRA_PROJECT_KEY: CRMY
      JIRA_SYNC_ENABLED: "false"
      JIRA_SYNC_DRY_RUN: "true"
      JIRA_SYNC_ALLOWED_ACTORS: shademounir
    steps:
      - name: Verify actor allowlist and repository write permission
        id: actor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case ",${JIRA_SYNC_ALLOWED_ACTORS}," in
            *",${GITHUB_ACTOR},"*) ;;
            *) exit 1 ;;
          esac
          permission="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
              --jq '.permission'
          )"
          case "${permission}" in
            admin|maintain|write) ;;
            *) exit 1 ;;
          esac
          echo "permission=${permission}" >> "${GITHUB_OUTPUT}"

      - name: Check out trusted repository content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test Jira simulation
        run: npm test

      - name: Scan complete Git history
        run: npm run security:history

      - name: Simulate Jira decision
        env:
          JIRA_SYNC_ACTOR_PERMISSION: ${{ steps.actor.outputs.permission }}
        run: node scripts/jira-sync/cli.mjs
