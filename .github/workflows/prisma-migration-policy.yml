name: Prisma migration policy

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: prisma-migration-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prisma-migration-policy:
    name: prisma-migration-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: crm_policy
          POSTGRES_PASSWORD: synthetic-policy-only
          POSTGRES_DB: crm_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_policy -d crm_policy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Refuse untrusted source before checkout
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EXPECTED_ACTOR: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "${SOURCE_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${ACTOR}" = "${EXPECTED_ACTOR}"

      - name: Check out reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit and apply migrations on ephemeral PostgreSQL only
        env:
          DATABASE_URL: postgresql://crm_policy:synthetic-policy-only@127.0.0.1:5432/crm_policy?schema=public
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MIGRATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-policy/migration-ci.mjs
