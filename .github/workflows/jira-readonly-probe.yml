name: Jira read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.repository == 'shademounir/CrmYnov'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      JIRA_SYNC_ENABLED: ${{ vars.JIRA_SYNC_ENABLED }}
      JIRA_SYNC_DRY_RUN: ${{ vars.JIRA_SYNC_DRY_RUN }}
      JIRA_SYNC_ALLOWED_ACTORS: ${{ vars.JIRA_SYNC_ALLOWED_ACTORS }}
    steps:
      - name: Enforce trusted main revision
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Execute read-only Jira probe
        shell: bash
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          echo "::add-mask::${JIRA_API_TOKEN}"
          node scripts/jira-sync/readonly-probe.mjs
